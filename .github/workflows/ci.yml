name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js v22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        run: pnpm install

      - name: Build server
        shell: bash
        run: pnpm --filter droidppboard-server build

      - name: Test server
        shell: bash
        run: pnpm --filter droidppboard-server test

  client:
    name: Client checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js v22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        run: pnpm install

      - name: Typecheck client
        shell: bash
        run: pnpm --filter droidppboard-client typecheck

      - name: Typecheck client tests
        shell: bash
        run: pnpm --filter droidppboard-client typecheck:tests

      - name: Lint client
        shell: bash
        run: pnpm --filter droidppboard-client lint

      - name: Check client formatting
        shell: bash
        run: pnpm --filter droidppboard-client format:check

      - name: Test client
        shell: bash
        run: pnpm --filter droidppboard-client test

      - name: Build client
        shell: bash
        run: pnpm --filter droidppboard-client build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js v22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        run: pnpm install

      # The tests run against a production build of their own (made by Playwright's web server in
      # e2e mode, so the login page has the captcha test key), so there is no separate build step.
      - name: Install Playwright browsers
        shell: bash
        run: pnpm --filter droidppboard-client exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        shell: bash
        run: pnpm --filter droidppboard-client test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7
